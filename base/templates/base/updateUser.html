{% extends 'main.html' %}

{% block content %}

<div class="form-wrapper">
    <div class="form-card">
        <h2 class="form-title">Update Account</h2>
        <p class="form-subtitle">Edit your profile information below.</p>

        <form action="" method="POST" class="styled-form" enctype="multipart/form-data">
            {% csrf_token %}

            <p>
                <label>Avatar</label>
                {% if request.user.avatar %}
                <img src="{{ request.user.avatar.url }}"
                    style="width:56px; height:56px; border-radius:50%; object-fit:cover; margin-bottom:0.5rem; border: 2px solid var(--border);">
                {% endif %}
                <input type="file" name="avatar" accept="image/*">
            </p>

            <p>
                <label>Name</label>
                <input type="text" name="name" value="{{ request.user.name }}" placeholder="Enter your name…">
            </p>

            <p>
                <label>Username</label>
                <input type="text" name="username" value="{{ request.user.username }}"
                    placeholder="Enter your username…">
            </p>

            <p>
                <label>Bio</label>
                <textarea name="bio" placeholder="Tell us about yourself…">{{ request.user.bio }}</textarea>
            </p>

            <div class="delete-actions">
                <a href="{% url 'userProfile' request.user.id %}" class="btn-back">Cancel</a>
                <button type="submit" class="btn-submit">Save Changes</button>
            </div>

        </form>
    </div>
</div>

{% endblock %}
